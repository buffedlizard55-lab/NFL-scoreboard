# GitHub Pages (Jekyll) configuration.
#
# The scoreboard is a fully static app (vanilla HTML/CSS/JS calling observed
# ESPN Gamecast web endpoints), so Pages can publish it straight from the repo
# root. Jekyll just needs to skip the development scaffolding.
exclude:
  - server.js
  - package.json
  - package-lock.json
  - test
  - README.md
  - node_modules
  - .github
